spring:
  application:
    name: safralink-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/safralink?createDatabaseIfNotExist=false&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:safralink}
    password: ${DB_PASSWORD:safralink}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

safralink:
  cors:
    origens: ${CORS_ORIGENS:http://localhost:4200}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  dados-demo: ${DADOS_DEMO:false}
