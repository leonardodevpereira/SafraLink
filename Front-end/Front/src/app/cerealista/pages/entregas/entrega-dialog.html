<h2 mat-dialog-title>Editar entrega</h2>

<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <mat-dialog-content>
    <p class="muted">{{ data.entrega.produtorNome }} · {{ data.entrega.produtoNome }}</p>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Quantidade (sacas)</mat-label>
      <input matInput type="number" step="0.01" min="0.01" inputmode="decimal" formControlName="quantidade" cdkFocusInitial />
      @if (form.controls.quantidade.touched && form.controls.quantidade.invalid) {
        <mat-error>Informe uma quantidade maior que zero.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Data da entrega</mat-label>
      <input matInput type="date" [max]="hoje" formControlName="dataEntrega" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Observação (opcional)</mat-label>
      <input matInput formControlName="observacao" maxlength="255" />
    </mat-form-field>

    @if (erro(); as e) {
      <p class="erro-form" role="alert">{{ e }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="salvando()">{{ salvando() ? 'Salvando…' : 'Salvar' }}</button>
  </mat-dialog-actions>
</form>
